<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="round">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
    <radialGradient id="cubeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(10,6,32,0.80)"/>
      <stop offset="65%"  stop-color="rgba(10,6,32,0.35)"/>
      <stop offset="100%" stop-color="rgba(10,6,32,0)"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#round)">
    <!-- Bandera de Cuba: 5 franjas (azul-blanco-azul-blanco-azul) -->
    <rect x="0" y="0"     width="512" height="102.4" fill="#002a8f"/>
    <rect x="0" y="102.4" width="512" height="102.4" fill="#ffffff"/>
    <rect x="0" y="204.8" width="512" height="102.4" fill="#002a8f"/>
    <rect x="0" y="307.2" width="512" height="102.4" fill="#ffffff"/>
    <rect x="0" y="409.6" width="512" height="102.4" fill="#002a8f"/>

    <!-- Triángulo rojo (asta) -->
    <polygon points="0,0 0,512 170,256" fill="#cf142b"/>

    <!-- Estrella blanca de 5 puntas -->
    <polygon fill="#ffffff" points="
      60,208
      70.78,241.17
      105.66,241.17
      77.44,261.67
      88.22,294.83
      60,274.34
      31.78,294.83
      42.56,261.67
      14.34,241.17
      49.22,241.17
    "/>

    <!-- Halo oscuro suave detrás del cubo (para que resalte) -->
    <rect width="512" height="512" fill="url(#cubeBg)"/>

    <!-- Cubo de Geometry Dash -->
    <rect x="146" y="146" width="220" height="220" rx="26" fill="#00e5ff" filter="url(#glow)"/>
    <rect x="180" y="180" width="152" height="152" rx="16" fill="#0a0620"/>
    <rect x="214" y="214" width="84"  height="84"  rx="8"  fill="#00e5ff"/>
    <rect x="234" y="234" width="44"  height="44"  rx="6"  fill="#0a0620"/>
  </g>
</svg>